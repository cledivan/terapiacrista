<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Terapia Cristã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="../assets/img/logo.png">
</head>
<body class="admin-body">

<template id="pageContent">
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-card-ico">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      </div>
      <div class="stat-card-label">Pacientes Ativos</div>
      <div class="stat-card-value" id="statPacientes">—</div>
      <div class="stat-card-sub">em acompanhamento</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-ico gold">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="stat-card-label">Sessões Hoje</div>
      <div class="stat-card-value" id="statHoje">—</div>
      <div class="stat-card-sub">agendamentos</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-ico blue">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      </div>
      <div class="stat-card-label">Sessões no Mês</div>
      <div class="stat-card-value" id="statMes">—</div>
      <div class="stat-card-sub">total agendado</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-ico purple">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div class="stat-card-label">Anamneses Novas</div>
      <div class="stat-card-value" id="statNovas">—</div>
      <div class="stat-card-sub">aguardando contato</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>📅 Sessões de Hoje</h3>
      <a href="agenda.html" class="btn btn-secondary btn-sm">Ver Agenda Completa</a>
    </div>
    <div id="sessoesHoje" class="agenda-grid"></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>🆕 Anamneses Recentes</h3>
      <a href="prontuarios.html" class="btn btn-secondary btn-sm">Ver Todas</a>
    </div>
    <table class="tc-table">
      <thead><tr><th>Nome</th><th>Telefone</th><th>Recebida em</th><th>Status</th><th></th></tr></thead>
      <tbody id="prontuariosRecentes"><tr><td colspan="5" class="tc-table-empty">Carregando...</td></tr></tbody>
    </table>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="shell.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
