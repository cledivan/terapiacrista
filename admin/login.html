<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Restrito | Terapia Cristã</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../anamnese/anamnese.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="../assets/img/logo.png">
</head>
<body class="login-body">

<div class="login-bg-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
</div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="../assets/img/logo.png" alt="Terapia Cristã">
      <h1>Painel Administrativo</h1>
      <p>Acesso restrito ao terapeuta</p>
    </div>

    <form id="loginForm" class="tc-form" autocomplete="off">
      <div class="ana-field">
        <label>E-mail</label>
        <input type="email" id="loginEmail" placeholder="admin@terapiacrista.com" required>
      </div>

      <div class="ana-field">
        <label>Senha</label>
        <div class="password-wrap">
          <input type="password" id="loginPass" placeholder="••••••••" required>
          <button type="button" class="password-toggle" id="togglePass" title="Mostrar senha">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div id="loginError" class="login-error" style="display:none"></div>
      <div id="loginSuccess" class="login-success" style="display:none"></div>

      <button type="submit" class="btn btn-primary login-btn" id="btnEntrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Entrar
      </button>

      <div class="login-extras">
        <a id="linkReset">Esqueceu a senha?</a>
      </div>
    </form>

    <div class="login-hint">
      <strong>Acesso Direto</strong><br>
      Gerencie usuários na tabela <em>usuarios_admin</em> no Supabase.
    </div>

    <a href="../index.html" class="login-back">← Voltar ao site</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
TC_UI.ready(async () => {
  // Se já logado, redireciona
  const s = await TC_AUTH.getSession();
  if (s) { window.location.href = 'dashboard.html'; return; }

  // Toggle senha
  document.getElementById('togglePass').addEventListener('click', () => {
    const inp = document.getElementById('loginPass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  });

  // Submit login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const senha = document.getElementById('loginPass').value;
    const err = document.getElementById('loginError');
    const suc = document.getElementById('loginSuccess');
    const btn = document.getElementById('btnEntrar');
    err.style.display = 'none'; suc.style.display = 'none';
    btn.disabled = true; btn.innerHTML = '<div class="tc-spinner" style="width:18px;height:18px;border-width:2px"></div> Entrando...';

    try {
      const user = await TC_AUTH.signIn(email, senha);
      
      // Lógica de Primeiro Acesso
      if (user.senha === 'admin123' && user.email === 'admin@terapiacrista.com') {
        suc.textContent = '👋 Primeiro acesso! Você deve alterar sua senha agora.';
        suc.style.display = 'block';
        setTimeout(() => window.location.href = 'perfil.html?first=true', 1500);
        return;
      }

      suc.textContent = '✓ Acesso autorizado. Redirecionando...';
      suc.style.display = 'block';
      setTimeout(() => window.location.href = 'dashboard.html', 600);
    } catch (e2) {
      console.error(e2);
      err.textContent = '❌ E-mail ou senha incorretos.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Entrar';
    }
  });

  // Reset
  document.getElementById('linkReset').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) { TC_UI.toast('Digite seu e-mail acima e clique novamente.', 'aviso'); return; }
    try {
      await TC_AUTH.resetPassword(email);
      TC_UI.toast('Enviamos um e-mail para redefinir sua senha.', 'sucesso', 5000);
    } catch (e) {
      TC_UI.toast('Não foi possível enviar. Verifique o e-mail.', 'erro');
    }
  });
});
</script>
</body>
</html>
