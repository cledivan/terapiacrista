<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp | Terapia Cristã</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="../assets/img/logo.png">
</head>
<body class="admin-body">
<template id="pageContent">
  <div class="panel">
    <div class="panel-head">
      <h3>💬 Envio rápido</h3>
    </div>
    <form id="formEnvio" class="tc-form">
      <div class="tc-form-row">
        <div class="tc-field">
          <label>Paciente</label>
          <select name="paciente_id" id="selPaciente">
            <option value="">— Digite o telefone manualmente —</option>
          </select>
        </div>
        <div class="tc-field">
          <label>Telefone (DDD + número)</label>
          <input type="tel" name="telefone" id="inpTelefone" data-mask="phone" placeholder="(00) 00000-0000">
        </div>
      </div>
      <div class="tc-field">
        <label>Modelo de mensagem</label>
        <select id="selModelo">
          <option value="">Mensagem personalizada</option>
          <option value="boas">Boas-vindas</option>
          <option value="pos">Pós-anamnese</option>
          <option value="lembrete">Lembrete de sessão</option>
        </select>
      </div>
      <div class="tc-field">
        <label>Mensagem</label>
        <textarea name="mensagem" id="txtMensagem" rows="6" placeholder="Digite ou cole a mensagem..."></textarea>
        <span class="ana-field-hint">Pode usar variáveis: {NOME}, {PRIMEIRO_NOME}, {HORA}, {DATA}</span>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px">
        <button type="button" class="btn btn-whatsapp" id="btnEnviar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 018.413 3.488 11.824 11.824 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24z"/></svg>
          Abrir WhatsApp
        </button>
      </div>
    </form>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>📜 Histórico (últimas 200)</h3></div>
    <table class="tc-table">
      <thead><tr><th>Data</th><th>Destinatário</th><th>Tipo</th><th>Mensagem</th></tr></thead>
      <tbody id="tabHistorico"><tr><td colspan="4" class="tc-table-empty">Carregando...</td></tr></tbody>
    </table>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/supabase-client.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="shell.js"></script>
<script src="whatsapp.js"></script>
</body>
</html>
